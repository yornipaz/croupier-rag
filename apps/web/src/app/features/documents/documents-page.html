<div class="h-full overflow-y-auto" data-testid="documents-page">
  <div class="mx-auto w-full max-w-5xl px-4 py-8 sm:px-6 sm:py-10">
    <div class="flex flex-col gap-4 sm:flex-row sm:items-end sm:justify-between">
      <div>
        <p class="text-[10px] font-semibold uppercase tracking-[0.24em] text-accent">Biblioteca</p>
        <h1
          class="font-display mt-2 text-3xl font-semibold tracking-[-0.03em] text-ink sm:text-4xl"
        >
          Documentos
        </h1>
        <p class="mt-2 max-w-xl text-sm leading-6 text-muted">
          Sube manuales, sigue la ingesta en vivo y elige qué documentos puede citar Croupier. La
          eliminación borra también sus vectores e imágenes.
        </p>
      </div>
      <span
        class="inline-flex w-fit items-center gap-2 rounded-full border border-line/80 bg-surface/70 px-3 py-1.5 text-[10px] font-semibold uppercase tracking-[0.14em] text-muted"
      >
        <app-icon name="layers" [size]="13" class="text-accent" />
        {{ documents().length }} documentos
      </span>
    </div>

    <div class="mt-7">
      <app-documents-panel />
    </div>
  </div>
</div>
