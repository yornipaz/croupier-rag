<form
  class="rounded-[1.4rem] border border-line/90 bg-surface/90 p-2 shadow-soft backdrop-blur-xl transition focus-within:border-accent/50"
  (submit)="submit()"
>
  <div class="flex items-end gap-2">
    <label class="sr-only" for="chat-input">Escribe tu consulta</label>
    <textarea
      #textarea
      id="chat-input"
      rows="1"
      [value]="draft()"
      (input)="onInput($event)"
      (keydown)="onKeydown($event)"
      class="min-h-11 max-h-[168px] flex-1 resize-none bg-transparent px-3 py-2.5 text-[0.95rem] leading-6 text-ink outline-none placeholder:text-muted/80"
      placeholder="Pregunta sobre el manual…"
      autocomplete="off"
      spellcheck="true"
      aria-describedby="chat-input-hint"
    ></textarea>
    <button
      type="submit"
      class="mb-0.5 inline-flex size-10 shrink-0 items-center justify-center rounded-xl bg-accent text-canvas shadow-sm transition hover:bg-accent-strong disabled:cursor-not-allowed disabled:opacity-35"
      [disabled]="!canSend()"
      aria-label="Enviar consulta"
    >
      <app-icon name="send" [size]="18" />
    </button>
  </div>

  <div class="flex flex-wrap items-center gap-2 px-1.5 pb-0.5 pt-1">
    <label class="sr-only" for="chat-document">Filtrar por documento</label>
    <div class="relative min-w-0">
      <select
        id="chat-document"
        [value]="selectedDocId() ?? ''"
        (change)="onDocumentChange($event)"
        class="max-w-52 appearance-none rounded-lg border border-line/80 bg-surface-2/60 py-1.5 pl-2.5 pr-7 text-[11px] font-medium text-muted outline-none transition hover:text-ink focus:border-accent/50"
      >
        <option value="" [selected]="!selectedDocId()">Todos los documentos</option>
        @for (document of documents(); track document.id) {
          <option [value]="document.id" [selected]="document.id === selectedDocId()">
            {{ document.filename }}
          </option>
        }
      </select>
      <app-icon
        name="chevron-right"
        [size]="12"
        class="pointer-events-none absolute right-2 top-1/2 -translate-y-1/2 rotate-90 text-muted"
      />
    </div>

    <span
      id="chat-input-hint"
      class="ml-auto hidden items-center gap-1 text-[10px] text-muted/80 sm:inline-flex"
    >
      <kbd class="rounded border border-line/80 bg-surface-2 px-1 py-0.5 font-sans text-[9px]"
        >Enter</kbd
      >
      envía
      <span class="mx-0.5 text-line">·</span>
      <kbd class="rounded border border-line/80 bg-surface-2 px-1 py-0.5 font-sans text-[9px]"
        >Shift</kbd
      >
      + Enter salta línea
    </span>
  </div>
</form>
