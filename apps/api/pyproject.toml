[project]
name = "croupier-rag-api"
version = "0.1.0"
description = "Multimodal RAG API for technical PDF manuals"
requires-python = ">=3.12,<3.13"
dependencies = [
    "celery[redis]>=5.6,<6",
    "fastapi>=0.162,<0.163",
    "fastembed>=0.9,<1",
    "google-genai>=2.34,<3",
    "httpx>=0.28,<0.29",
    "pydantic>=2.14,<3",
    "pydantic-settings>=2.16,<3",
    "pymupdf>=2.0,<3",
    "python-multipart>=0.0.20,<1",
    "qdrant-client>=1.20,<2",
    "redis>=8.1,<9",
    "sse-starlette>=3.6,<4",
    "structlog>=26.1,<27",
    "tenacity>=9.0,<9.2",
    "uvicorn[standard]>=0.54,<0.55",
]

[dependency-groups]
dev = [
    "httpx2>=2.16,<3",
    "import-linter>=2.15,<3",
    "mypy>=2.4,<3",
    "pytest>=9.2,<10",
    "pytest-asyncio>=1.4,<2",
    "respx>=0.23,<1",
    "ruff>=0.17,<0.18",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF", "C4", "PT"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers"
filterwarnings = ["error"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
show_error_codes = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["fastembed.*", "google.genai.*", "celery.*", "sse_starlette.*"]
ignore_missing_imports = true

# PyMuPDF exposes untyped C-extension methods; keep strict typing in our code.
[[tool.mypy.overrides]]
module = [
    "app.modules.ingestion.infrastructure.parser",
    "app.modules.documents.infrastructure.pymupdf_renderer",
]
disallow_untyped_calls = false

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
